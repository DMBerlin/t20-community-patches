# Publishes the GitHub Release that the Foundry manifest URL points to
# (releases/latest/download/module.json). Triggered by pushing a vX.Y.Z tag;
# the release skill pushes it with `git push --follow-tags origin main`.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tag
        run: |
          version=$(node -p 'require("./module.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match module.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          grep -q "^## $GITHUB_REF_NAME - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no $GITHUB_REF_NAME section"; exit 1; }

      - name: Test
        run: node --test "tests/*.test.mjs"

      - name: Package
        run: |
          bash tools/package.sh
          node tools/changelog.mjs notes "${GITHUB_REF_NAME#v}" > dist/notes.md
          t20=$(node -p 'require("./module.json").relationships.systems.find((s) => s.id === "tormenta20").compatibility.verified')
          echo "RELEASE_TITLE=$GITHUB_REF_NAME · Tormenta20 $t20" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip \
            --verify-tag --latest --title "$RELEASE_TITLE" --notes-file dist/notes.md

      - name: Verify manifest
        run: |
          repo="https://github.com/$GITHUB_REPOSITORY"
          for attempt in 1 2 3 4 5 6; do
            served=$(curl -fsSL "$repo/releases/latest/download/module.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version' || true)
            [ "v$served" = "$GITHUB_REF_NAME" ] && break
            sleep 10
          done
          if [ "v$served" != "$GITHUB_REF_NAME" ]; then
            echo "::error::latest manifest serves '$served', expected ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          download=$(node -p 'require("./module.json").download')
          curl -fsIL -o /dev/null "$download" || { echo "::error::download URL not reachable: $download"; exit 1; }
          echo "Manifest serves $GITHUB_REF_NAME; download OK"
