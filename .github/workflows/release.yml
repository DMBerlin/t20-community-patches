# Publishes the GitHub Release that the Foundry manifest URL points to
# (releases/latest/download/module.json). Triggered by pushing a vX.Y.Z tag,
# e.g. `git push --follow-tags origin main` after the release skill.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches module.json
        run: |
          version=$(node -p 'require("./module.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match module.json version $version"
            exit 1
          fi

      - name: Test
        run: node --test "tests/*.test.mjs"

      - name: Package
        run: |
          bash tools/package.sh
          node tools/changelog.mjs notes "${GITHUB_REF_NAME#v}" > dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
